name: Dashboard clinico - seguranca e interface
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dashboard-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node tests/dashboard-safety.cjs
      - run: node tests/evaluation-scoring.cjs
      - run: node tests/pti-improvements.cjs
      - run: node tests/musicoterapia-workflow.cjs
      - run: node tests/anamnesis-safety.cjs
      - run: npm run build
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/dashboard-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          python tests/dashboard_journey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-synthetic-screenshots
          path: artifacts/dashboard/*.png
          if-no-files-found: ignore
