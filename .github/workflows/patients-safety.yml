name: Pacientes - integridade e experiencia clinica
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patients-clinical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node --test tests/patients-safety.cjs
      - run: npm run build
      - run: npx eslint src/hooks/usePatientsData.ts src/pages/patients.tsx src/pages/components/patients/PatientList.tsx src/pages/components/patients/PatientCard.tsx src/pages/components/patients/PatientCareMenu.tsx src/pages/components/patients/PatientDialogs.tsx src/pages/components/patients/PatientPhotoUpload.tsx
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/patients-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          python tests/patients_journey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patients-synthetic-screenshots
          path: artifacts/patients/*.png
          if-no-files-found: ignore
