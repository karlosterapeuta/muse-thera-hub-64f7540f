name: MuseTera R2 clinical documents validation

on:
  pull_request:
    paths:
      - "src/pages/backup/**"
      - "src/utils/r2ClinicalDocuments.ts"
      - "supabase/functions/clinical-documents/**"
      - "supabase/functions/migrate-legacy-clinical-pdf/**"
      - "supabase/functions/cleanup-verified-clinical-pdfs/**"
      - "supabase/migrations/*r2*.sql"
      - "supabase/config.toml"
      - ".github/workflows/r2-clinical-documents-validation.yml"

jobs:
  frontend-build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build portal
        run: npm run build
      - name: Validate R2 security boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const fn = fs.readFileSync('supabase/functions/clinical-documents/index.ts', 'utf8');
          const cfg = fs.readFileSync('supabase/config.toml', 'utf8');
          const legacy = fs.readFileSync('supabase/functions/migrate-legacy-clinical-pdf/index.ts', 'utf8');
          const cleanup = fs.readFileSync('supabase/functions/cleanup-verified-clinical-pdfs/index.ts', 'utf8');
          const legacySQL = fs.readFileSync('supabase/migrations/20261021_r2_pilot_limit_to_admin_owned_pdfs.sql','utf8');
          const ui = fs.readFileSync('src/pages/backup/index.tsx', 'utf8');
          const checks = [
            [cfg.includes('verify_jwt = true'), 'JWT must stay enabled'],
            [fn.includes('supabase.auth.getUser'), 'Authenticated user required'],
            [fn.includes('.eq("owner_user_id", user.id)'), 'Owner scoped reads required'],
            [fn.includes('.eq("professional_id", user.id)'), 'Patient ownership required'],
            [fn.includes('sha256(bytes)'), 'SHA-256 verification required'],
            [!fn.includes("Access-Control-Allow-Origin: *"), "No permissive CORS"],
            [ui.includes('isAdmin && <R2StoragePilot />'), 'Pilot must be admin only'],
            [ui.includes('isAdmin && <R2LegacyCopyPilot />'), 'Legacy pilot must be admin only'],
            [cfg.includes('[functions.migrate-legacy-clinical-pdf]'), 'Legacy function needs JWT config'],
            [legacy.includes('caller.rpc("has_role",{role:"admin"})'), 'Legacy backend role verification required'],
            [legacy.includes('item.source_path.startsWith(item.owner_user_id+"/")'), 'Legacy originals must be bound to their owner'],
            [legacy.includes('new GetObjectCommand'), 'Round-trip GET verification required'],
            [legacy.includes('sha256_hex:digest'), 'Persist SHA256 required'],
            [legacy.includes('sourceDeleted:false'), 'Never delete legacy originals'],
            [!legacy.includes('storage.from("clinical-pdfs").remove'), 'Do not delete Supabase originals'],
            [cleanup.includes('caller.rpc("has_role",{role:"admin"})'), 'Cleanup must be admin only'],
            [cleanup.includes('GetObjectCommand'), 'Cleanup must read R2 before removing source'],
            [cleanup.includes('db.storage.from("clinical-pdfs").remove'), 'Cleanup must use Storage API'],
            [cleanup.includes('legacy_verified_at'), 'Cleanup must require previous verification'],
            [cleanup.includes('digest(originalBytes)') && cleanup.includes('digest(bytes)'), 'Cleanup must hash both copies'],
            [ui.includes('isAdmin && <R2VerifiedCleanup />'), 'Cleanup UI must be admin only'],
            [legacySQL.includes("o.owner_id=auth.uid()::text"), 'Pilot must select admin-owned originals only'],
          ];
          for (const [ok, msg] of checks) {
            if (!ok) throw new Error(msg);
          }
          console.log('R2 security checks complete.');
          JS
